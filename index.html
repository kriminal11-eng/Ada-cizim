<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ada Çizim">
  <meta name="theme-color" content="#ffe3f1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Ada'nın Çizim Defteri</title>
</head>
<body>
<div id="app">

  <!-- Açılış -->
  <section id="splash" class="screen active">
    <div class="splash-inner">
      <div class="splash-emoji">🦄 🎨 ✏️</div>
      <h1 class="rainbow-title" data-rainbow="Ada'nın Çizim Defteri"></h1>
      <div class="splash-hello">Merhaba Ada! 👋</div>
      <div class="tap-hint">Başlamak için dokun</div>
    </div>
  </section>

  <!-- Ana sayfa -->
  <section id="home" class="screen">
    <header class="topbar">
      <h1 class="rainbow-title small" data-rainbow="Ada'nın Çizim Defteri"></h1>
      <div class="spacer"></div>
      <button class="btn" id="btnMute" aria-label="Ses">🔊</button>
    </header>
    <div class="home-grid">
      <button class="card c-pink" data-go="letters"><span class="card-big">ABC</span><span class="card-lbl">Harfler</span></button>
      <button class="card c-blue" data-go="digits"><span class="card-big">123</span><span class="card-lbl">Rakamlar</span></button>
      <button class="card c-purple" data-go="pages"><span class="card-emoji">🦄</span><span class="card-lbl">Boyama</span></button>
      <button class="card c-orange" data-go="free"><span class="card-emoji">🎨</span><span class="card-lbl">Serbest Çizim</span></button>
      <button class="card c-green" data-go="gallery"><span class="card-emoji">🖼️</span><span class="card-lbl">Resimlerim</span></button>
    </div>
  </section>

  <!-- Harf / rakam seçimi -->
  <section id="picker" class="screen">
    <header class="topbar">
      <button class="btn back" data-home aria-label="Geri">⬅️</button>
      <h2 id="pickerTitle">Harfler</h2>
      <div class="spacer"></div>
      <div class="star-count" id="pickerStars"></div>
    </header>
    <div class="scroll"><div class="pick-grid" id="pickGrid"></div></div>
  </section>

  <!-- İzleme -->
  <section id="trace" class="screen">
    <header class="topbar">
      <button class="btn back" id="traceBack" aria-label="Geri">⬅️</button>
      <div class="trace-word" id="traceWord"></div>
      <div class="spacer"></div>
      <button class="btn" id="btnSay">🔊<span class="lbl">Dinle</span></button>
      <button class="btn" id="btnShow">👀<span class="lbl">Göster</span></button>
      <button class="btn" id="btnRetry">🔁<span class="lbl">Baştan</span></button>
    </header>
    <div class="work">
      <div class="stage" id="traceStage">
        <div class="board" id="traceBoard"><canvas id="traceCanvas"></canvas></div>
        <button class="nav-arrow left" id="tracePrev" aria-label="Önceki">◀</button>
        <button class="nav-arrow right" id="traceNext" aria-label="Sonraki">▶</button>
        <div class="done-pop" id="donePop">
          <div class="done-emoji" id="doneEmoji"></div>
          <div class="done-text" id="doneText"></div>
          <div class="done-btns">
            <button class="btn wide" id="doneAgain">🔁 Tekrar</button>
            <button class="btn wide go" id="doneNext">Sonraki ▶</button>
          </div>
        </div>
      </div>
      <div class="palette" id="inkPalette"></div>
    </div>
  </section>

  <!-- Boyama sayfası seçimi -->
  <section id="pages" class="screen">
    <header class="topbar">
      <button class="btn back" data-home aria-label="Geri">⬅️</button>
      <h2>Boyama</h2>
    </header>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="scroll"><div class="page-grid" id="pageGrid"></div></div>
  </section>

  <!-- Çizim / boyama -->
  <section id="draw" class="screen">
    <header class="topbar">
      <button class="btn back" id="drawBack" aria-label="Geri">⬅️</button>
      <h2 id="drawTitle"></h2>
      <div class="spacer"></div>
      <button class="btn" id="btnUndo">↩️<span class="lbl">Geri Al</span></button>
      <button class="btn" id="btnClear">🗑️<span class="lbl">Temizle</span></button>
      <button class="btn save" id="btnSave">⭐<span class="lbl">Kaydet</span></button>
    </header>
    <div class="work">
      <div class="toolbar" id="tools"></div>
      <div class="stage" id="drawStage"><div class="board" id="drawBoard"></div></div>
      <div class="palette" id="palette"></div>
    </div>
  </section>

  <!-- Galeri -->
  <section id="gallery" class="screen">
    <header class="topbar">
      <button class="btn back" data-home aria-label="Geri">⬅️</button>
      <h2>Resimlerim</h2>
      <div class="spacer"></div>
      <div class="star-count" id="galleryCount"></div>
    </header>
    <div class="scroll"><div class="page-grid" id="galleryGrid"></div></div>
  </section>

  <!-- Resim görüntüleme -->
  <section id="viewer" class="screen">
    <header class="topbar">
      <button class="btn back" id="viewerBack" aria-label="Geri">⬅️</button>
      <h2 id="viewerTitle"></h2>
      <div class="spacer"></div>
    </header>
    <div class="viewer-body">
      <img id="viewerImg" alt="">
      <div class="viewer-btns">
        <button class="btn wide go" id="vEdit">✏️ Devam Et</button>
        <button class="btn wide" id="vShare">📤 Gönder / Fotoğraflara Kaydet</button>
        <button class="btn wide" id="vRename">🏷️ İsim Ver</button>
        <button class="btn wide danger hold" id="vDelete"><span class="hold-fill"></span><span class="hold-lbl">🗑️ Sil (basılı tut)</span></button>
      </div>
    </div>
  </section>
</div>

<div id="dialog" class="dialog"></div>
<canvas id="fx"></canvas>
<svg id="measure" width="0" height="0" aria-hidden="true"></svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
